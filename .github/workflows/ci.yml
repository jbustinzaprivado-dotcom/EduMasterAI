# Integración continua (§14 fase 1, §13): pruebas contra PostgreSQL real, migraciones y build de la web.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API y migraciones (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: edumaster
          POSTGRES_PASSWORD: edumaster-ci
          POSTGRES_DB: edumaster_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edumaster -d edumaster_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas (§13) contra PostgreSQL
        env:
          EDUMASTER_TEST_DATABASE_URL: postgresql+psycopg://edumaster:edumaster-ci@localhost:5432/edumaster_test
        run: python -m pytest
      - name: Migraciones al día con los modelos y bitácora inmutable
        env:
          EDUMASTER_DATABASE_URL: postgresql+psycopg://edumaster:edumaster-ci@localhost:5432/edumaster_test
          PGPASSWORD: edumaster-ci
        run: |
          psql -h localhost -U edumaster -d edumaster_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          python -m alembic upgrade head
          python -m alembic check
          psql -h localhost -U edumaster -d edumaster_test -c "INSERT INTO audit_logs (id, action, resource, occurred_at) VALUES (gen_random_uuid(), 'ci.test', 'ci', now());"
          if psql -h localhost -U edumaster -d edumaster_test -c "DELETE FROM audit_logs;"; then
            echo "La bitácora debería rechazar DELETE" && exit 1
          fi
          python -m alembic downgrade base

  ml:
    name: ML (sin fuga, etiqueta y NumPy = PyTorch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Instalar dependencias (PyTorch CPU)
        run: |
          pip install -r requirements.txt -r ../apps/api/requirements.txt
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest

  web:
    name: Web (tipos, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo para el control de dist
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # La web compilada se versiona para instalar sin npm (D49). Si alguien cambia la web y no recompila, falla aquí.
      # Se compara por fechas de commit, no byte a byte: Windows (CRLF) y Linux generan archivos distintos.
      - name: dist versionada al día
        run: |
          src=$(git log -1 --format=%ct -- src index.html package.json vite.config.ts)
          dist=$(git log -1 --format=%ct -- dist)
          if [ "$src" -gt "$dist" ]; then
            echo "::error::La web cambió después de la última apps/web/dist versionada: ejecuta npm run build y súbela"
            exit 1
          fi

  e2e:
    name: E2E (Playwright sobre la web real)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Compilar la web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Navegador de Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E (§13)
        working-directory: apps/web
        env:
          E2E_PYTHON: python
          PW_CHANNEL: ""
        run: npm run e2e
      - name: Reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
